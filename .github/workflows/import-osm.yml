name: Загрузить места из OpenStreetMap

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-osm.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Проверить импорт
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Получить адреса и координаты Петербурга
        run: python scripts/import_places.py --provider osm
      - name: Сохранить каталог с атрибуцией ODbL
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: mestno-osm-spb
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/places.json
            dist/places.csv
